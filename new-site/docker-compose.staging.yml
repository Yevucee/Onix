# Staging deployment — private review environment
# Usage: docker compose -f docker-compose.staging.yml up --build -d
# Requires: .env.staging (copy from .env.example, never commit)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onix_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:-onix_staging}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-onix_staging}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${STAGING_PORT:-3000}:3000'
    env_file:
      - .env.staging
    environment:
      SITE_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-onix_staging}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-onix_staging}
    volumes:
      - media_staging:/app/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata_staging:
  media_staging:
